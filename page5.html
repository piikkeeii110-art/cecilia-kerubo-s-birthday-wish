<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="clay-bg">
    <main class="container">
        <div class="clay-card letter-card">
            
            <!-- Header Row with Text-to-Speech Button -->
            <div class="letter-header-row">
                <h2 class="clay-title">For you only</h2>
                <button id="speak-btn" class="clay-btn icon-only-btn" title="Listen to Letter">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </button>
            </div>

            <!-- 2x2 Fidget Spinner Profile Matrix -->
            <div class="spinner-container">
                <div id="fidget-matrix" class="fidget-matrix">
                    <div class="profile-circle top-left">
                        <img src="cecillia1.jpg" alt="Cecillia 1">
                    </div>
                    <div class="profile-circle top-right">
                        <img src="cecillia2.jpg" alt="Cecillia 2">
                    </div>
                    <div class="profile-circle bottom-left">
                        <img src="cecillia3.jpg" alt="Cecillia 3">
                    </div>
                    <div class="profile-circle bottom-right">
                        <img src="cecillia4.jpg" alt="Cecillia 4">
                    </div>
                    <!-- Center Clay Bearing -->
                    <div class="center-bearing">✨</div>
                </div>
            </div>

            <!-- Typed Letter Container -->
            <div id="letter-content" class="letter-body"></div>

        </div>
    </main>

    <!-- Full-Screen Image Modal Viewer -->
    <div id="image-modal" class="modal-overlay hidden-modal">
        <div class="clay-card modal-card full-view-card">
            <button id="close-modal-btn" class="clay-btn icon-only-btn" style="align-self: flex-end; margin-bottom: 10px;">✕</button>
            <img id="modal-img-element" src="" alt="Cecillia Full View" style="width: 100%; border-radius: 20px; object-fit: cover; max-height: 70vh;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
